name: Android APK

on:
  push:
    branches: [openbgi-android]
  workflow_dispatch:

concurrency:
  group: openbgi-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Build OpenBGI WebAssembly engine
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Cytlan/openbgi.git openbgi-src
          git -C openbgi-src checkout --detach 40b144a03e15f159cadc957387e6f94bce8de65f

          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.74
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.74
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          cd openbgi-src
          # Keep the initial allocation and growth ceiling friendlier to lower-memory phones.
          sed -i 's/-sINITIAL_MEMORY=268435456/-sINITIAL_MEMORY=134217728/' Makefile
          sed -i 's/-sMAXIMUM_MEMORY=2147483648/-sMAXIMUM_MEMORY=1073741824/' Makefile
          make wasm VORBIS=none OPT=-O2

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp bin/wasm/openbgi.html bin/wasm/openbgi.js bin/wasm/openbgi.wasm "$GITHUB_WORKSPACE/app/src/main/assets/"
          cp LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/OPENBGI-COPYING"

      - name: Build debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.10.2/bin/gradle assembleDebug --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openbgi-android-debug
          path: app/build/outputs/apk/debug/*.apk
